<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextBrand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #f97316;
      --secondary: #ec4899;
      --tertiary: #a855f7;
      --bg: #0a0a0f;
      --card: #13131d;
      --card-hover: #1c1c2a;
      --input: #1a1a27;
      --text: #f8fafc;
      --text2: rgba(248,250,252,0.55);
      --text3: rgba(248,250,252,0.3);
      --border: rgba(248,250,252,0.06);
      --success: #34d399;
      --error: #f87171;
      --ring: rgba(249,115,22,0.25);
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      width: 100%;
      display: flex;
    }

    .loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Auth ── */
    #root { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; width: 100%; flex: 1; }
    .auth { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 20px; }
    .auth-logo img { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 10px; }
    .auth-logo h1 { font-size: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-logo p { color: var(--text2); font-size: 12px; margin-top: 4px; }

    .tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text2); font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; transition: .2s; }
    .tab.active { background: var(--card-hover); color: var(--text); }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
    .field input { width: 100%; padding: 10px 12px; background: var(--input); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; transition: .2s; }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
    .field input::placeholder { color: var(--text3); }

    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 38px; }
    .pass-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: .2s; }
    .pass-toggle:hover { color: var(--text2); }
    .pass-toggle svg { width: 16px; height: 16px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: .2s; width: 100%; color: var(--text); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-p { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
    .btn-p:hover:not(:disabled) { opacity: .9; }
    .btn-s { background: var(--input); border: 1px solid var(--border); }
    .btn-s:hover:not(:disabled) { background: var(--card-hover); }
    .btn-sm { padding: 7px 12px; font-size: 12px; width: auto; }

    .err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); color: var(--error); padding: 8px 12px; border-radius: 10px; font-size: 12px; margin-bottom: 12px; display: none; }

    /* ── App shell ── */
    .shell { display: flex; flex-direction: column; height: 100vh; }

    .shell-body { display: flex; flex: 1; overflow: hidden; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-left img { width: 28px; height: 28px; border-radius: 7px; }
    .header-left h2 { font-size: 15px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-right { display: flex; align-items: center; gap: 6px; }

    /* ── Nav ── */
    .nav { display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--border); width: 64px; flex-shrink: 0; padding: 8px 0; }
    .nav-btn { display: flex; align-items: center; justify-content: center; padding: 14px 4px; border: none; background: transparent; color: var(--text2); cursor: pointer; border-left: 2px solid transparent; transition: .2s; position: relative; }
    .nav-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .nav-btn.active { color: var(--primary); border-left-color: var(--primary); background: rgba(249,115,22,.08); }
    .nav-btn svg { width: 20px; height: 20px; }
    .nav-btn:hover::after { content: attr(title); position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); background: var(--card); color: var(--text); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; z-index: 10; pointer-events: none; }

    /* ── Content ── */
    .content { flex: 1; padding: 16px; overflow-y: auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Dashboard ── */
    .dash-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
    .badge-live { display: inline-flex; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 10px; border-radius: 20px; background: rgba(52,211,153,.15); color: var(--success); margin-bottom: 8px; }
    .dash-top h1 { font-size: 20px; font-weight: 800; }
    .dash-top h1 span { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .dash-top p { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .plan-pill { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; flex-shrink: 0; }
    .plan-pill-icon { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; }
    .plan-pill-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
    .plan-pill-name { font-size: 14px; font-weight: 700; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .stat-icon svg { width: 16px; height: 16px; }
    .stat-val { font-size: 20px; font-weight: 800; }
    .stat-lbl { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
    .glass-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .chart-header h3 { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .chart-icon { display: inline-flex; }
    .chart-icon svg { width: 16px; height: 16px; color: var(--primary); }
    .chart-toggles { display: flex; gap: 4px; background: var(--bg); border-radius: 8px; padding: 3px; }
    .chart-toggle { padding: 5px 10px; border: none; border-radius: 6px; background: transparent; color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; transition: .2s; }
    .chart-toggle.active { background: var(--card); color: var(--text); }
    .chart-body { margin-top: 0; }
    .chart-empty { text-align: center; padding: 30px 16px; color: var(--text2); font-size: 13px; }
    .dash-cols { display: flex; flex-direction: column; gap: 16px; }
    .dash-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .dash-card-header h3 { font-size: 13px; font-weight: 700; }
    .dash-link { background: none; border: none; color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; }
    .dash-link:hover { text-decoration: underline; }
    .p-list { display: flex; flex-direction: column; gap: 8px; }
    .p-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .p-row-left { display: flex; align-items: center; gap: 10px; }
    .p-ico { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .p-ico svg { width: 16px; height: 16px; fill: white; }
    .p-name { font-weight: 600; font-size: 13px; }
    .p-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .p-status { font-size: 11px; padding: 3px 9px; border-radius: 20px; }
    .p-status.on { background: rgba(34,197,94,.15); color: var(--success); }
    .p-status.off { background: rgba(255,255,255,.06); color: var(--text3); }
    .qa-list { display: flex; flex-direction: column; gap: 6px; }
    .qa-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: .2s; }
    .qa-item:hover { background: var(--card-hover); }
    .qa-item-left { display: flex; align-items: center; gap: 10px; }
    .qa-item-icon { width: 28px; height: 28px; border-radius: 8px; background: rgba(249,115,22,.1); display: flex; align-items: center; justify-content: center; }
    .qa-item-icon svg { width: 14px; height: 14px; color: var(--primary); }
    .qa-item-label { font-size: 12px; font-weight: 600; }
    .qa-item-arrow { color: var(--text3); }
    .qa-item-arrow svg { width: 14px; height: 14px; }
    .upgrade-banner { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; overflow: hidden; margin-top: 8px; }
    .upgrade-bg { position: absolute; top: -50%; right: -20%; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(249,115,22,.15), transparent); }
    .upgrade-bg2 { position: absolute; bottom: -30%; left: -10%; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(236,72,153,.1), transparent); }
    .upgrade-content { position: relative; }
    .upgrade-content h3 { font-size: 16px; font-weight: 800; }
    .upgrade-content p { font-size: 12px; color: var(--text2); margin: 6px 0 14px; }
    .upgrade-btn { padding: 8px 20px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
    .upgrade-btn:hover { opacity: .9; }

    /* ── Chat ── */
    .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 120px); }
    .chat-empty-state { text-align: center; padding: 40px 16px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ces-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
    .ces-icon svg { width: 22px; height: 22px; color: var(--text2); }
    .chat-empty-state h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .chat-empty-state p { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
.suggested-prompts { 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
  width: 100%;
  margin-top: 12px;
}
.suggested-prompts button { 
  width: 100%; 
  text-align: left; 
  padding: 10px 14px; 
  border: 1px solid var(--border); 
  border-radius: 12px; 
  background: var(--card); 
  color: var(--text); 
  font-size: 13px; 
  font-weight: 500; 
  cursor: pointer; 
  transition: all .2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.suggested-prompts button:hover { 
  border-color: var(--primary); 
  color: var(--primary);
  background: rgba(249,115,22,.05);
  transform: translateX(-2px);
}
    .chat-footnote { text-align: center; font-size: 10px; color: var(--text3); margin-top: 8px; padding-bottom: 4px; }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
    .msg.u { align-self: flex-end; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-bottom-right-radius: 4px; }
    .msg.a { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.sys { align-self: center; background: transparent; color: var(--text3); font-size: 11px; text-align: center; padding: 6px; }
    .msg strong { font-weight: 700; }
    .msg ul, .msg ol { padding-left: 1.25rem; margin: 0.35rem 0; }
    .msg li { margin-bottom: 0.15rem; }
    .msg p { margin-bottom: 0.35rem; }
    .msg p:last-child { margin-bottom: 0; }
    .msg code { background: rgba(255,255,255,.08); padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.75rem; font-family: monospace; }
    .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; border-bottom-left-radius: 4px; }
    .typing span { width: 7px; height: 7px; background: var(--text3); border-radius: 50%; animation: typ 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes typ { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

    .chat-bar { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
    .chat-in { flex: 1; padding: 9px 12px; background: var(--input); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; resize: none; font-family: inherit; }
    .chat-in:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
    .chat-in::placeholder { color: var(--text3); }
    .chat-send { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 10px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: .2s; }
    .chat-send:hover { opacity: .9; }
    .chat-send:disabled { opacity: .4; }
    .chat-send svg { width: 16px; height: 16px; }

    /* ── Connect ── */
    .c-list { display: flex; flex-direction: column; gap: 12px; }
    .c-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .c-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .c-info { display: flex; align-items: center; gap: 12px; }
    .c-ico { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .c-ico svg { width: 20px; height: 20px; fill: white; }
    .c-name { font-size: 15px; font-weight: 700; }
    .c-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .c-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .c-stat { background: var(--bg); border-radius: 8px; padding: 8px; text-align: center; }
    .c-stat-v { font-size: 14px; font-weight: 700; }
    .c-stat-l { font-size: 9px; color: var(--text2); text-transform: uppercase; margin-top: 2px; }

    /* ── Account ── */
    .acct-profile { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .acct-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; flex-shrink: 0; }
    .acct-info { flex: 1; min-width: 0; }
    .acct-name { font-weight: 700; font-size: 14px; }
    .acct-email { font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; }
    .badge-free { background: rgba(255,255,255,.06); color: var(--text2); }
    .badge-pro { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }

    .acct-section { font-size: 14px; font-weight: 700; margin-bottom: 12px; }

    .plans-list { display: flex; flex-direction: column; gap: 12px; }
    .plan-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; position: relative; }
    .plan-popular { border-color: var(--primary); }
    .plan-popular-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; }
    .plan-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .plan-name { font-weight: 700; font-size: 15px; }
    .plan-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .plan-price { text-align: right; }
    .plan-price-val { font-size: 20px; font-weight: 800; }
    .plan-price-int { font-size: 11px; color: var(--text2); }
    .plan-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .plan-card-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .plan-card-icon.normal { background: var(--bg); color: var(--text2); }
    .plan-card-icon.popular { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
    .plan-card-icon svg { width: 18px; height: 18px; stroke: currentColor; }
    .plan-card-name { font-weight: 700; font-size: 14px; }
    .plan-card-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .plan-price-row { margin-bottom: 14px; }
    .plan-btn { margin-bottom: 14px; width: 100%; padding: 10px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: .2s; }
    .plan-btn:disabled { opacity: .5; cursor: not-allowed; }
    .plan-btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
    .plan-btn-primary:hover:not(:disabled) { opacity: .9; }
    .plan-btn-secondary { background: var(--input); border: 1px solid var(--border); color: var(--text); }
    .plan-btn-secondary:hover:not(:disabled) { background: var(--card-hover); }
    .plan-features { display: flex; flex-direction: column; gap: 6px; }
    .plan-feat { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
    .plan-feat-off { color: var(--text3); }
    .plan-feat-icon { width: 14px; height: 14px; flex-shrink: 0; }
    .plan-feat-off .plan-feat-icon { color: var(--text3); }

    .acct-footer { text-align: center; font-size: 11px; color: var(--text3); margin-top: 20px; padding-bottom: 8px; }

    /* ── Account Dropdown ── */
    .acct-dropdown { position: relative; margin-bottom: 20px; }
    .acct-profile { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer; transition: .2s; }
    .acct-profile:hover { background: var(--card-hover); }
    .acct-arrow { width: 16px; height: 16px; margin-left: auto; transition: .2s; }
    .acct-dropdown-menu { position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .acct-dropdown-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; border: none; background: transparent; color: var(--text); text-align: left; cursor: pointer; transition: .2s; }
    .acct-dropdown-item:hover { background: var(--card-hover); }
    .acct-dropdown-item:first-child { border-radius: 12px 12px 0 0; }
    .acct-dropdown-item:last-child { border-radius: 0 0 12px 12px; }
    .acct-logout.acct-dropdown-item { color: var(--error); margin-top: 0; width: 100%; justify-content: flex-start; }
    .acct-logout.acct-dropdown-item:hover { background: rgba(239,68,68,.1); }

    /* ── Settings ── */
    .settings-panel { display: flex; flex-direction: column; gap: 16px; }
    .setting-group { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .setting-group h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; }
    .setting-row label { font-size: 13px; font-weight: 500; }
    .setting-select { background: var(--input); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 6px 10px; font-size: 12px; outline: none; cursor: pointer; }
    .setting-btn { background: var(--input); border: 1px solid var(--border); border-radius: 8px; color: var(--primary); font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; }
    .setting-btn:hover { background: var(--card-hover); }
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: var(--input); border-radius: 22px; border: 1px solid var(--border); transition: .2s; }
    .toggle input:checked + .toggle-slider { background: linear-gradient(135deg, var(--primary), var(--secondary)); border-color: transparent; }
    .toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px; background: var(--text2); border-radius: 50%; transition: .2s; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: #fff; }
